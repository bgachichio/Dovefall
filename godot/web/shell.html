<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">

	<!-- viewport-fit=cover lets the page paint under the notch and the home
	     indicator; the #frame rule below then insets the CANVAS back out of
	     them, so the sky fills the screen but no button ever hides under
	     hardware. user-scalable=no kills double-tap zoom, which in a
	     one-touch game is a misfire, not a gesture.

	     interactive-widget is left at its default (resizes-visual): the soft
	     keyboard must NOT resize the layout, or the whole game squashes when
	     a player types their name. -->
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
	<meta name="theme-color" content="#1F3864">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Dovefall">
	<meta name="description" content="One touch. Storm, deep and sky. Free to play.">

	<!-- Link previews on WhatsApp, X, Facebook. Crawlers do not run JavaScript,
	     so these have to be absolute and correct at export time.
	     DOVEFALL_ORIGIN is checked by site/verify-export.mjs before deploy. -->
	<meta property="og:title" content="Dovefall">
	<meta property="og:description" content="One touch. Storm, deep and sky. Beat my score.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://gachichio.org/dovefallgame/">
	<meta property="og:image" content="https://gachichio.org/dovefallgame/index.icon.png">
	<meta name="twitter:card" content="summary_large_image">

	<title>$GODOT_PROJECT_NAME</title>

	<style>
	:root {
		--sky: $GODOT_SPLASH_COLOR;
		--paper: #E8EDF5;
		--gold: #C8922E;
	}

	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: var(--sky);
		color: var(--paper);
		font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
		overscroll-behavior: none;          /* no pull-to-refresh mid-run */
		-webkit-user-select: none;
		user-select: none;
		-webkit-tap-highlight-color: transparent;
		-webkit-text-size-adjust: 100%;
	}

	/* The usable rectangle: the visible viewport, minus the safe areas.
	   100dvh rather than 100vh is the whole iOS Safari fix — vh is the
	   toolbar-hidden height, so a vh-sized canvas runs off the bottom of the
	   screen behind the address bar. dvh tracks the toolbars, and by spec
	   ignores the soft keyboard, which is exactly the behaviour we want. */
	#frame {
		position: fixed;
		left: env(safe-area-inset-left, 0px);
		top: env(safe-area-inset-top, 0px);
		width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
		height: 100vh;
		height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
		display: block;
	}

	/* Sized in JavaScript, never by CSS percentages: the canvas backing store
	   and its CSS box have to agree exactly or every touch lands offset. */
	#canvas {
		display: block;
		margin: 0;
		padding: 0;
		border: 0;
		touch-action: none;
		outline: none;
	}
	#canvas:focus { outline: none; }

	#status, #status-splash, #status-progress {
		position: absolute;
		left: 0;
		right: 0;
	}
	#status, #status-splash { top: 0; bottom: 0; }

	#status {
		background-color: var(--sky);
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
		visibility: hidden;
		z-index: 5;
	}
	#status-splash { max-height: 100%; max-width: 100%; margin: auto; }
	#status-splash.show-image--false { display: none; }
	#status-splash.fullsize--true { height: 100%; width: 100%; object-fit: contain; }
	#status-splash.use-filter--false { image-rendering: pixelated; }

	#status-progress, #status-notice { display: none; }
	#status-progress {
		bottom: 22%;
		width: 46%;
		height: 6px;
		margin: 0 auto;
		appearance: none;
		-webkit-appearance: none;
		border: 0;
		border-radius: 3px;
		background: rgba(232, 237, 245, 0.18);
	}
	#status-progress::-webkit-progress-bar { background: rgba(232, 237, 245, 0.18); border-radius: 3px; }
	#status-progress::-webkit-progress-value { background: var(--gold); border-radius: 3px; }
	#status-progress::-moz-progress-bar { background: var(--gold); border-radius: 3px; }

	#status-word {
		position: absolute;
		bottom: 16%;
		left: 0; right: 0;
		text-align: center;
		font-size: 15px;
		letter-spacing: 0.28em;
		text-transform: uppercase;
		color: rgba(232, 237, 245, 0.55);
	}

	#status-notice {
		background-color: #5b3943;
		border-radius: 0.5rem;
		border: 1px solid #9b3943;
		color: #e0e0e0;
		line-height: 1.4;
		margin: 0 2rem;
		overflow: hidden;
		padding: 1rem;
		text-align: center;
		z-index: 1;
	}

	/* Turn the phone back. Shown only when the window is BOTH landscape and
	   short — a tablet or a laptop in landscape plays fine, pillarboxed, and
	   must not be nagged. The threshold is where a 154-unit control drops
	   below the 44 CSS px floor in design.md 8.2. */
	#rotate {
		position: fixed;
		inset: 0;
		z-index: 10;
		display: none;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 18px;
		background: var(--sky);
		text-align: center;
		padding: 0 32px;
	}
	body.cramped #rotate { display: flex; }
	#rotate .glyph {
		width: 44px; height: 72px;
		border: 3px solid var(--paper);
		border-radius: 8px;
		transform: rotate(90deg);
		animation: turn 2.4s ease-in-out infinite;
	}
	@keyframes turn {
		0%, 40% { transform: rotate(90deg); }
		60%, 100% { transform: rotate(0deg); }
	}
	@media (prefers-reduced-motion: reduce) {
		#rotate .glyph { animation: none; transform: rotate(0deg); }
	}
	#rotate p { margin: 0; font-size: 17px; letter-spacing: 0.04em; }
	#rotate small { color: rgba(232, 237, 245, 0.55); font-size: 13px; }

	/* Shown instead of the game on anything that is not a handheld. It is a
	   dead end by design: no download starts, so a desktop visitor costs us
	   nothing and gets a link they can actually use. */
	#handheld-only {
		position: fixed;
		inset: 0;
		z-index: 20;
		display: flex;
		align-items: center;
		justify-content: center;
		background: var(--sky);
		padding: 24px;
	}
	#handheld-only[hidden] { display: none; }
	#handheld-only .card { max-width: 30rem; text-align: center; }
	#handheld-only .mark {
		width: 64px; height: 40px;
		margin: 0 auto 28px;
		border-radius: 50% 50% 50% 8px;
		background: var(--paper);
		opacity: 0.9;
	}
	#handheld-only h1 {
		margin: 0 0 14px;
		font-size: 26px;
		font-weight: 600;
		letter-spacing: 0.01em;
	}
	#handheld-only p {
		margin: 0 0 26px;
		font-size: 15px;
		line-height: 1.6;
		color: rgba(232, 237, 245, 0.72);
	}
	#handheld-only .url {
		font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
		font-size: 15px;
		word-break: break-all;
		background: rgba(0, 0, 0, 0.22);
		border-radius: 10px;
		padding: 14px 16px;
		margin-bottom: 16px;
		-webkit-user-select: text;
		user-select: text;
	}
	#handheld-only button {
		font: inherit;
		font-size: 15px;
		color: #fff;
		background: #B06A2C;
		border: 0;
		border-radius: 10px;
		padding: 13px 26px;
		min-height: 48px;
		cursor: pointer;
	}
	#handheld-only button:hover { background: #C2793a; }
	#handheld-only small {
		display: block;
		margin-top: 22px;
		font-size: 12px;
		color: rgba(232, 237, 245, 0.38);
	}

	$GODOT_HEAD_INCLUDE
	</style>
</head>
<body>
	<div id="frame">
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
	</div>

	<noscript>Dovefall needs JavaScript. Please enable it and reload.</noscript>

	<div id="status">
		<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
		<progress id="status-progress"></progress>
		<div id="status-word">Dovefall</div>
		<div id="status-notice"></div>
	</div>

	<div id="rotate">
		<div class="glyph"></div>
		<p>Turn your phone upright</p>
		<small>Dovefall is played in portrait.</small>
	</div>

	<div id="handheld-only" hidden>
		<div class="card">
			<div class="mark"></div>
			<h1>Dovefall is a phone game</h1>
			<p>It is built for one thumb on a touchscreen, so it only runs on a
			phone or tablet. Open this link there and it will start straight away.</p>
			<div class="url" id="ho-url"></div>
			<button id="ho-copy" type="button">Copy link</button>
			<small id="ho-why"></small>
		</div>
	</div>

	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const GODOT_URL = '$GODOT_URL';

// ------------------------------------------------------------------ device
//
// Dovefall is a phone game. One thumb, portrait, a touchscreen. It is not
// merely nicer on a phone — the whole control scheme is a tap — so a desktop
// visitor is shown a link instead of a game, and the ~6 MB engine is never
// downloaded to a machine that cannot play it.
//
// The test is "is the primary pointer a finger", not "does the user-agent
// string say Android". A phone with Request-Desktop-Site on still passes; a
// laptop with a touchscreen and a mouse attached still fails, which is right.
function dovefallDeviceClass(nav, win) {
	function mq(q) {
		return typeof win.matchMedia === 'function' && win.matchMedia(q).matches;
	}

	// Support escape hatch. Lets the game be demonstrated on a laptop without
	// weakening the check for anyone else.
	if (typeof win.location === 'object' && /[?&]device=any\b/.test(win.location.search || '')) {
		return { handheld: true, why: 'override' };
	}

	var touchPoints = nav.maxTouchPoints || 0;

	// Chromium tells us outright, and is right about phones.
	if (nav.userAgentData && nav.userAgentData.mobile === true) {
		return { handheld: true, why: 'client hint' };
	}

	// iPadOS 13+ reports itself as a Mac. Touch points give it away.
	if (/^Mac/.test(nav.platform || '') && touchPoints > 1) {
		return { handheld: true, why: 'ipad' };
	}

	// The general case: a coarse primary pointer that cannot hover, plus a
	// real touchscreen. Covers every phone and tablet, and no desktop.
	var coarse = mq('(pointer: coarse)');
	var noHover = mq('(hover: none)');
	if (coarse && noHover && touchPoints > 0) {
		return { handheld: true, why: 'touch' };
	}

	var reason = !touchPoints ? 'no touchscreen'
		: !coarse ? 'a mouse or trackpad is the main pointer'
			: 'this browser reports a desktop pointer';
	return { handheld: false, why: reason };
}

var DOVEFALL_DEVICE = dovefallDeviceClass(navigator, window);

if (!DOVEFALL_DEVICE.handheld) {
	(function () {
		var panel = document.getElementById('handheld-only');
		var url = window.location.href.split('#')[0].split('?')[0];
		document.getElementById('ho-url').textContent = url;
		document.getElementById('ho-why').textContent = 'Detected: ' + DOVEFALL_DEVICE.why + '.';
		panel.hidden = false;
		document.getElementById('status').remove();

		var copy = document.getElementById('ho-copy');
		copy.addEventListener('click', function () {
			var done = function () { copy.textContent = 'Copied'; };
			if (navigator.clipboard && navigator.clipboard.writeText) {
				navigator.clipboard.writeText(url).then(done, done);
			} else {
				done();
			}
		});
		console.log('dovefall: not a handheld (' + DOVEFALL_DEVICE.why + ') — engine not loaded');
	}());
} else {

// ------------------------------------------------------------------ sizing
//
// canvas_resize_policy is set to None in the export preset, so Godot adopts
// whatever size this code gives the canvas and updates GL to match. Godot's
// own Adaptive policy uses window.innerWidth/innerHeight, which on iOS Safari
// and on Android with the keyboard open are the wrong numbers.
//
// The stretch mode is canvas_items with aspect "keep", so whatever box we hand
// over, the VIEWPORT inside it stays exactly 1080x1920 and the remainder is
// letterboxed in the chapter's sky colour. Screen size changes the size of the
// picture. It cannot change the size of the playfield, so a big phone and a
// small one are playing the identical course.
(function () {
	var frame = document.getElementById('frame');
	var canvas = document.getElementById('canvas');

	// Above 3x the extra pixels cost battery and buy nothing: the design
	// canvas is 1080 wide, and 3x on a 360 CSS px phone is already 1080.
	var DPR_CAP = 3;
	// Below this height a landscape window cannot hold a legal touch target.
	var CRAMPED_H = 480;

	var cramped = false;

	function fit() {
		var w = frame.clientWidth;
		var h = frame.clientHeight;
		if (w < 1 || h < 1) return;

		var dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
		var fw = Math.max(1, Math.round(w * dpr));
		var fh = Math.max(1, Math.round(h * dpr));

		canvas.style.width = w + 'px';
		canvas.style.height = h + 'px';
		if (canvas.width !== fw || canvas.height !== fh) {
			canvas.width = fw;
			canvas.height = fh;
		}

		var nowCramped = h < CRAMPED_H && w > h;
		if (nowCramped !== cramped) {
			cramped = nowCramped;
			document.body.classList.toggle('cramped', cramped);
			// Godot listens for window blur and AppState pauses the run on it,
			// so covering the canvas does not cost the player a life.
			if (cramped) window.dispatchEvent(new Event('blur'));
		}

		var scale = Math.min(w / 1080, h / 1920);
		console.log(
			'dovefall: viewport ' + w + 'x' + h + ' css, dpr ' + dpr
			+ ', framebuffer ' + fw + 'x' + fh
			+ ', scale ' + scale.toFixed(3)
			+ ' — playfield is 1080x1920 regardless',
		);
	}

	var queued = false;
	function schedule() {
		if (queued) return;
		queued = true;
		requestAnimationFrame(function () { queued = false; fit(); });
	}

	fit();
	if (typeof ResizeObserver !== 'undefined') {
		new ResizeObserver(schedule).observe(frame);
	}
	window.addEventListener('resize', schedule);
	window.addEventListener('orientationchange', schedule);
	// Toolbar collapse on iOS fires neither of the above reliably.
	if (window.visualViewport) window.visualViewport.addEventListener('resize', schedule);
	window.dovefallFit = fit;
}());

// ------------------------------------------------------------------ boot
(function () {
	var statusOverlay = document.getElementById('status');
	var statusProgress = document.getElementById('status-progress');
	var statusNotice = document.getElementById('status-notice');
	var statusWord = document.getElementById('status-word');

	var initializing = true;
	var statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusWord.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
		text.split('\n').forEach(function (line) {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) setStatusNotice(err.message);
		else if (typeof err === 'string') setStatusNotice(err);
		else setStatusNotice('Dovefall could not start on this browser.');
		setStatusMode('notice');
		initializing = false;
	}

	setStatusMode('progress');

	// The engine is fetched here rather than by a <script src> tag in the head,
	// so that the desktop branch above costs a visitor nothing at all.
	var tag = document.createElement('script');
	tag.src = GODOT_URL;
	tag.onerror = function () {
		displayFailureNotice('Could not load the game. Check your connection and reload.');
	};
	tag.onload = function () {
		var missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
		if (missing.length !== 0) {
			displayFailureNotice(
				'Dovefall needs a feature this browser is missing:\n' + missing.join('\n'),
			);
			return;
		}
		var engine = new Engine(GODOT_CONFIG);
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(function () {
			setStatusMode('hidden');
			if (window.dovefallFit) window.dovefallFit();
		}, displayFailureNotice);
	};
	document.head.appendChild(tag);
}());

}
	</script>
</body>
</html>
