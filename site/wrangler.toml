# Dovefall — the game bundle.
#
# A second Worker, separate from the API, whose only job is to serve the Godot
# web export as static assets. Static assets are unmetered on the free plan, so
# the ~5 MB engine download costs nothing however many people play — which is
# the entire reason the bundle does not come from the VM.
#
# Directory layout mirrors the URL: put the Godot export in
# public/dovefallgame/ and it is served at <host>/dovefallgame/.

name = "dovefall-site"
compatibility_date = "2026-08-01"
workers_dev = true

[assets]
directory = "./public"

# Individual files (foo.html) serve without a trailing slash; folder indexes
# (dovefallgame/index.html) serve WITH one. This matters more than it looks:
# Godot's index.html references index.js and index.wasm relatively, so a
# request to /dovefallgame with no slash would resolve them against the root
# and 404 the engine. The redirect to /dovefallgame/ is what stops that.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# ---------------------------------------------------------------- routes
#
# Uncomment ONLY after gachichio.org's nameservers point at Cloudflare AND the
# root A record is Proxied (orange cloud). A Worker route cannot fire on a
# hostname whose traffic never reaches Cloudflare, so a grey-cloud record here
# fails silently — the VM keeps serving and you get a 404 with no error.
#
# Everything not matching this pattern still goes to Caddy on the VM, so the
# rest of gachichio.org is untouched.
#
# routes = [
#   { pattern = "gachichio.org/dovefallgame*", zone_name = "gachichio.org" }
# ]
