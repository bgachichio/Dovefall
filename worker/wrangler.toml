# Dovefall API — Cloudflare Worker.
#
# Secrets are NEVER written here. Set them with `wrangler secret put`:
#   SESSION_SECRET     — 32+ random bytes; rotating it signs every player out
#   GOOGLE_CLIENT_IDS  — comma-separated OAuth client IDs (web + Android)

name = "dovefall-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

[observability]
enabled = true

# ---------------------------------------------------------------- maintenance
#
# Hourly, on the hour. Prunes expired rows and records the day's projected
# usage, so the shed flag is never more than an hour stale. Cron triggers are
# free on the Workers free plan (5 per account); this uses one.
#
# Hourly rather than nightly on purpose: a nightly job discovers you blew the
# budget the morning after, which is not a guard, it is a post-mortem.
[triggers]
crons = ["0 * * * *"]

[vars]
# Origins allowed to call this API from a browser, comma separated, matched
# exactly. The Android build sends no Origin header and is unaffected. Never
# "*" — this API carries a bearer token.
#
# gachichio.org is where the game ends up. Until the DNS move it is served
# from workers.dev, and THAT origin has to be added here or the very first
# play fails CORS — the console names the origin it wanted, and it goes in
# this list verbatim. DEPLOY.md section 6b.
ALLOWED_ORIGINS = "https://gachichio.org,https://dovefall-site.REPLACE-ME.workers.dev"

# The hosted Paystack payment page. Public by nature — the secret key is a
# wrangler secret, never a var.
PAYSTACK_LINK = "https://paystack.shop/pay/dovefall"

# KES 50.00, in Paystack subunits (cents). A payment below this is recorded
# but grants nothing.
RESPAWN_MIN_SUBUNITS = "5000"

[[d1_databases]]
binding = "DB"
database_name = "dovefall"
database_id = "b0aa203a-2e22-466c-b0b2-a9013956608f"
