# Every push runs the suite. The determinism test is the one that matters:
# if the server's port of Rng.gd stops reproducing 4075699207, the server and
# the game no longer share a physics and nothing else here can be trusted.
name: test

on:
  push:
  pull_request:
  # Weekly, so a dependency or runtime change that breaks us is found by CI
  # rather than by a player.
  schedule:
    - cron: "0 4 * * 1"

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm test
      - name: Fail on known vulnerabilities
        run: npm audit --audit-level=high

  game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      # The engine tests first: they are fast and they hold the checksum.
      - run: npm test
      - run: npm run build
      # Then the real thing, in a real browser, at six phone sizes.
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-timeout=120000 "test/play.test.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: game/shots/

  site:
    runs-on: ubuntu-latest
    needs: game
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      # A deploy that would bypass the mobile-only gate must fail here, not
      # after it is live.
      - name: Build the game and preflight the bundle
        run: |
          (cd ../game && npm install --no-audit --no-fund && npm run build)
          npm run sync
          node verify-build.mjs public/dovefallgame

  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A patch that no longer applies is a deployment that stops halfway
      # through §5 with a half-modified game project.
      - name: Every patch is well-formed
        run: |
          for p in godot/patches/*.patch; do
            git apply --check --numstat "$p" >/dev/null 2>&1 \
              || echo "cannot verify $p without the game tree (expected here)"
            grep -q '^--- a/' "$p" || { echo "$p has no source header"; exit 1; }
            grep -q '^@@ '     "$p" || { echo "$p has no hunk"; exit 1; }
          done
