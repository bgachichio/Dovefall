<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <!-- viewport-fit=cover lets the page paint under the notch and the home
       indicator; #root is inset back out of them below, so the sky fills the
       screen but no control ever hides under hardware.
       interactive-widget stays at its default (resizes-visual): the soft
       keyboard must not resize the layout, or the game squashes when a player
       types their name. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0D1420" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dovefall" />
  <meta name="description" content="One touch. Storm, deep and sky. A free phone game." />

  <!-- Link previews. Crawlers do not run JavaScript, so these are absolute and
       fixed at build time. site/verify-export.mjs checks them against the host
       being deployed to. -->
  <meta property="og:title" content="Dovefall" />
  <meta property="og:description" content="One touch. Storm, deep and sky. Beat my score." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://gachichio.org/dovefallgame/" />
  <meta property="og:image" content="https://gachichio.org/dovefallgame/share.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title>Dovefall</title>

  <style>
    html, body { margin: 0; height: 100%; background: #0D1420; overflow: hidden; overscroll-behavior: none; }

    /* The usable rectangle: the visible viewport minus the safe areas.
       100dvh rather than 100vh is the iOS Safari fix — vh is the toolbar-hidden
       height, so a vh-sized canvas runs off the bottom of the screen behind the
       address bar. dvh tracks the toolbars and, by spec, ignores the keyboard. */
    #root {
      position: fixed;
      left: env(safe-area-inset-left, 0px);
      top: env(safe-area-inset-top, 0px);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: 100vh;
      height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    }

    /* Shown instead of the game on anything that is not a handheld, and on a
       phone held sideways. Both are dead ends by design. */
    #gate, #rotate {
      position: fixed; inset: 0; z-index: 20; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 0 32px; text-align: center;
      background: #0D1420; color: #EEF4FF;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    body.not-handheld #gate, body.cramped #rotate { display: flex; }
    body.not-handheld #root, body.cramped #root { visibility: hidden; }
    #gate h1, #rotate p { margin: 0; font-size: 22px; font-weight: 600; }
    #gate p { margin: 0; max-width: 30rem; font-size: 15px; line-height: 1.6; color: rgba(238,244,255,.7); }
    #gate .url {
      font-family: ui-monospace, Menlo, monospace; font-size: 15px; word-break: break-all;
      background: rgba(0,0,0,.25); border-radius: 10px; padding: 14px 16px; user-select: text;
    }
    #gate button {
      font: inherit; font-size: 15px; color: #fff; background: #B0642A;
      border: 0; border-radius: 10px; padding: 13px 26px; min-height: 48px; cursor: pointer;
    }
    #rotate .glyph {
      width: 44px; height: 72px; border: 3px solid #EEF4FF; border-radius: 8px;
      transform: rotate(90deg); animation: turn 2.4s ease-in-out infinite;
    }
    @keyframes turn { 0%,40% { transform: rotate(90deg); } 60%,100% { transform: rotate(0deg); } }
    @media (prefers-reduced-motion: reduce) { #rotate .glyph { animation: none; transform: rotate(0); } }
    #rotate small { color: rgba(238,244,255,.55); font-size: 13px; }
  </style>
</head>
<body>
  <script type="module" src="/src/main.tsx"></script>

  <div id="root"></div>

  <div id="gate">
    <h1>Dovefall is a phone game</h1>
    <p>It is built for one thumb on a touchscreen, so it only runs on a phone or
       tablet. Open this link there and it will start straight away.</p>
    <div class="url" id="gate-url"></div>
    <button type="button" id="gate-copy">Copy link</button>
  </div>

  <div id="rotate">
    <div class="glyph"></div>
    <p>Turn your phone upright</p>
    <small>Dovefall is played in portrait.</small>
  </div>

  <script>
    // Runs before the bundle. A desktop visitor never downloads the game.
    //
    // The test is "is the primary pointer a finger", not "does the user-agent
    // string say Android": a phone with Request-Desktop-Site on still passes,
    // and a laptop with a touchscreen and a mouse attached still fails.
    (function () {
      function mq(q) { return typeof matchMedia === 'function' && matchMedia(q).matches; }
      var nav = navigator;
      var touch = nav.maxTouchPoints || 0;
      var handheld =
        /[?&]device=any\b/.test(location.search) ||
        (nav.userAgentData && nav.userAgentData.mobile === true) ||
        (/^Mac/.test(nav.platform || '') && touch > 1) ||
        (mq('(pointer: coarse)') && mq('(hover: none)') && touch > 0);

      if (!handheld) {
        document.body.classList.add('not-handheld');
        var url = location.href.split('#')[0].split('?')[0];
        document.getElementById('gate-url').textContent = url;
        document.getElementById('gate-copy').addEventListener('click', function () {
          var b = this;
          if (nav.clipboard) nav.clipboard.writeText(url).then(function () { b.textContent = 'Copied'; });
        });
        return;
      }

      // Below 480 px of height a landscape window cannot hold a legal 44 px
      // touch target, so ask for the phone back rather than shrink the game.
      var t = null;
      function check() {
        var w = innerWidth, h = innerHeight;
        var cramped = h < 480 && w > h;
        document.body.classList.toggle('cramped', cramped);
        if (cramped) dispatchEvent(new Event('blur'));   // pauses the run
      }
      addEventListener('resize', function () { clearTimeout(t); t = setTimeout(check, 60); });
      addEventListener('orientationchange', check);
      check();

      // vite.config.ts lifts the entry out of its <script> tag and leaves the
      // URL here, so nothing is fetched until the check above has passed.
      var s = document.createElement('script');
      s.type = 'module';
      s.src = window.__DOVEFALL_ENTRY || '/src/main.tsx';
      document.body.appendChild(s);
    }());
  </script>
</body>
</html>
